name: Publish image

# Builds the Docker image when something that goes into it changes on main, and
# publishes it to the GitHub Container Registry, so Unraid (or any Docker host)
# can pull updates. Documentation-only pushes do not trigger a build. Run it by
# hand from the Actions tab (Run workflow) to force a rebuild.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - ensure-chrome.sh
      - crontab
      - redeem.js
      - package.json
      - package-lock.json
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
